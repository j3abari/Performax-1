<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performax1 - Get Started</title>
    <meta http-equiv="refresh" content="0; url=getting-started.html">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        a { color: #E61919; text-decoration: none; }
    </style>
</head>
<body>
    <p>Redirecting... <a href="getting-started.html">Click here</a> if not redirected.</p>
    <script>window.location.href = 'getting-started.html';</script>

    <!-- Theme Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme) {
                document.body.setAttribute('data-theme', currentTheme);
            }
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    if (document.body.getAttribute('data-theme') === 'light') {
                        document.body.removeAttribute('data-theme');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.body.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    }
                });
            }
        });
    </script>


    <!-- Scroll to Top Button -->
    <button id="scrollToTopBtn" aria-label="Scroll to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script>
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    scrollToTopBtn.classList.add('visible');
                } else {
                    scrollToTopBtn.classList.remove('visible');
                }
            });
            scrollToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
</body>
</html>
